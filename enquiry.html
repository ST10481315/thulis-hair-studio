<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Get a Quote - Thuli's Hair Studio</title>
</head>

<body>

    <header>

        <img src="images/logo.jpg.jpeg"
             alt="Thuli's Hair Studio Logo"
             class="logo">

        <h1>Thuli's Hair Studio</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <h2>Get a Quote</h2>

        <p>
            Complete the form below to enquire about a hairstyle or
            request a quote from Thuli's Hair Studio.
        </p>

        <form action="#" method="post" class="enquiry-form">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your full name"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email address"
                       required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="Enter your phone number"
                       required>
            </div>

            <div class="form-group">
                <label for="service">Select Service</label>

                <select id="service" name="service" required>
                    <option value="">-- Choose a service --</option>
                    <option value="braids">Braids</option>
                    <option value="weaves">Weaves</option>
                    <option value="wigs">Wigs</option>
                    <option value="hair-treatment">Hair Treatment</option>
                    <option value="styling">Hair Styling</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Preferred Date</label>

                <input type="date"
                       id="date"
                       name="date"
                       required>
            </div>

            <div class="form-group">
                <label for="time">Preferred Time</label>

                <input type="time"
                       id="time"
                       name="time"
                       required>
            </div>

            <div class="form-group">
                <label for="message">Additional Information</label>

                <textarea id="message"
                          name="message"
                          rows="5"
                          placeholder="Tell us anything we should know about your appointment..."></textarea>
            </div>

            <div class="form-buttons">

                <button type="submit">
                    Send Enquiry
                </button>

                <button type="reset">
                    Clear Form
                </button>

            </div>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Thuli's Hair Studio. All rights reserved.</p>
    </footer>

</body>

</html>
